name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: How was the media found
      options:
        - Bookmarklet
        - Pasted page source
        - Pasted link (public post)
        - Not sure
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 140 on macOS 15
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: >-
        Anything red in the browser console. Please do not paste page source or
        fbcdn URLs - they are signed links to private content.
      render: text
